<!-- Archivo: `src/app/modules/auth/login/login.component.html` -->
<div class="w-full h-screen flex flex-col p-10 gap-10">
  <div class="flex items-center justify-between">
    <div>
      <button class="text-gray-800 rounded" routerLink="/">
        <arrow-uturn-left-solid-icon [size]="32"></arrow-uturn-left-solid-icon>
      </button>
    </div>
    <div>
      <img src="/assets/logos/logo-job-trading.svg" alt="JOB-TRADING" class="h-10">
    </div>
  </div>
  <div class="flex-1 flex flex-col justify-between overflow-hidden gap-5">
    <div class="flex flex-col gap-5">
      <span class="text-4xl font-questrial text-neutral-900">Vamos a iniciar sesión.</span>
      <span class="text-xl text-neutral-900">¡Bienvenido de nuevo, te extrañamos!</span>
    </div>

    <div class="flex flex-col gap-5 flex-grow overflow-hidden">
      <form [formGroup]="registerForm" class="flex flex-col gap-2">
        <div class="gap-3 grid">

          <div class="flex flex-col ro">
            <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
            <div class="relative">
              <input formControlName="email" placeholder="Correo electrónico" type="text" class="w-full p-2 border border-gray-300 rounded-2xl" required>
            </div>
            <div class="text-red-600 text-sm">
              <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">
                Campo requerido
              </p>
              <p *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('pattern')">
                Número celular inválido
              </p>
            </div>
          </div>

          <div class="flex flex-col">
            <label class="block text-sm font-medium text-gray-700">Contraseña</label>
            <div class="relative">
              <input formControlName="password" placeholder="Contraseña" [type]="passwordVisible ? 'text' : 'password'" class="w-full p-2 border border-gray-300 rounded-2xl" required>
            </div>
            <div class="text-red-600 text-sm">
              <p *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">
                Campo requerido
              </p>
            </div>
          </div>

          <div class="flex items-center">
            <input type="checkbox" id="showPassword" (change)="togglePasswordVisibility()" [checked]="passwordVisible">
            <label for="showPassword" class="ml-2">Mostrar Contraseña</label>
          </div>

          <div *ngIf="showAlert" class="text-red-600">
            <p>No se puedo iniciar sesión, intente nuevamente</p>
          </div>
        </div>
      </form>
    </div>
    <p class="text-center">
      ¿No tiene cuenta?, <a routerLink="/register" class="underline">Regístrese</a>
    </p>
    <div class="flex items-center gap-2 rounded-3xl bg-neutral-100">
      <button (click)="onSendForm()" class="bg-black text-white py-2 px-4 rounded flex-1 flex items-center justify-center rounded-2xl">
        Iniciar sesión
      </button>
    </div>
  </div>
  <app-loading-screen *ngIf="loadingForm"></app-loading-screen>
</div>
